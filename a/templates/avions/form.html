<th:block th:fragment="content" xmlns:th="http://www.thymeleaf.org">

    <div class="card">
        <div class="card-header">
            <h3 class="card-title"><i class="fas fa-plane"></i> <span th:text="${editAvion != null ? 'Modifier Avion' : 'Nouveau Avion'}"></span></h3>
        </div>

        <div class="card-body">
            <form method="post" th:action="@{/avions/save}">
                <input type="hidden" name="id" th:value="${editAvion != null ? editAvion.id : ''}" />

                <div class="form-group">
                    <label>Code Avion</label>
                    <input type="text" name="codeAvion" required class="form-control" th:value="${editAvion != null ? editAvion.codeAvion : ''}">
                </div>

                <div class="form-group">
                    <label>Modèle</label>
                    <select name="modeleAvion.id" required class="form-control">
                        <option value="">-- Sélectionner --</option>
                        <option th:each="m : ${modeles}" th:value="${m.id}" th:text="${m.nomModele}" th:selected="${editAvion != null and editAvion.modeleAvion != null and editAvion.modeleAvion.id == m.id}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Capacité Passagers</label>
                    <input type="number" name="capacitePassagers" required class="form-control" th:value="${editAvion != null ? editAvion.capacitePassagers : ''}">
                </div>

                <div class="form-group">
                    <label>Capacité Cargo</label>
                    <input type="number" step="0.01" name="capaciteCargo" required class="form-control" th:value="${editAvion != null ? editAvion.capaciteCargo : ''}">
                </div>

                <div class="form-group">
                    <label>État</label>
                    <select name="etatAvion.id" required class="form-control">
                        <option value="">-- Sélectionner --</option>
                        <option th:each="e : ${etats}" th:value="${e.id}" th:text="${e.etat}" th:selected="${editAvion != null and editAvion.etatAvion != null and editAvion.etatAvion.id == e.id}"></option>
                    </select>
                </div>

                <div class="form-group mt-3">
                    <a href="/avions" class="btn btn-secondary">Annuler</a>
                    <button type="submit" class="btn btn-primary">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

</th:block>
