<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{layout/main :: html(
          pageTitle='Gestion des Vols',
          pageDescription='Planification et suivi des vols',
          breadcrumb='Vols',
          breadcrumbParent='Vols & Avions',
          breadcrumbParentUrl='/avions',
          currentPage='vols',
          content=~{::content}
      )}">
<body>
    <th:block th:fragment="content">
        <!-- Filter Card -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">
                    <i class="fas fa-filter"></i>
                    Filtres de recherche
                </h3>
                <button type="button" class="btn btn-sm btn-secondary" id="resetFilters">
                    <i class="fas fa-redo"></i> Réinitialiser
                </button>
            </div>
            <div class="card-body">
                <form id="filterForm" class="filter-bar">
                    <div class="filter-group">
                        <label for="filterNumero">N° Vol</label>
                        <input type="text" id="filterNumero" name="numero" placeholder="Ex: MAD-001">
                    </div>
                    <div class="filter-group">
                        <label for="filterDepart">Aéroport Départ</label>
                        <select id="filterDepart" name="depart">
                            <option value="">Tous</option>
                            <option th:each="aeroport : ${aeroports}" th:value="${aeroport.codeIata}" th:text="${aeroport.codeIata + ' - ' + aeroport.nom}"></option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filterArrivee">Aéroport Arrivée</label>
                        <select id="filterArrivee" name="arrivee">
                            <option value="">Tous</option>
                            <option th:each="aeroport : ${aeroports}" th:value="${aeroport.codeIata}" th:text="${aeroport.codeIata + ' - ' + aeroport.nom}"></option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filterStatus">Status</label>
                        <select id="filterStatus" name="status">
                            <option value="">Tous</option>
                            <option th:each="status : ${statusList}" th:value="${status.status}" th:text="${status.status}"></option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filterDateDepart">Date Départ</label>
                        <input type="date" id="filterDateDepart" name="dateDepart">
                    </div>
                </form>
            </div>
        </div>

        <!-- Data Card -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">
                    <i class="fas fa-plane-departure"></i>
                    Liste des Vols
                    <span class="badge badge-primary" id="resultCount" th:text="${vols != null ? #lists.size(vols) + ' vol(s)' : ''}"></span>
                </h3>
                <button type="button" class="btn btn-primary" data-modal-open="formModal" onclick="AviationApp.resetForm()">
                    <i class="fas fa-plus"></i> Nouveau Vol
                </button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>N° Vol</th>
                                <th>Avion</th>
                                <th>Départ</th>
                                <th>Arrivée</th>
                                <th>Date/Heure Départ</th>
                                <th>Date/Heure Arrivée</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Real data -->
                            <tr th:each="vol : ${vols}" th:if="${vols != null}" th:data-id="${vol.id}">
                                <td data-filter="numero" th:text="${vol.numeroVol}"></td>
                                <td th:text="${vol.avion?.codeAvion}"></td>
                                <td data-filter="depart" th:text="${vol.aeroportDepart?.codeIata}"></td>
                                <td data-filter="arrivee" th:text="${vol.aeroportArrivee?.codeIata}"></td>
                                <td th:text="${#temporals.format(vol.dateHeureDepart, 'dd/MM/yyyy HH:mm')}"></td>
                                <td th:text="${#temporals.format(vol.dateHeureArrivee, 'dd/MM/yyyy HH:mm')}"></td>
                                <td data-filter="status">
                                    <span class="badge" 
                                          th:classappend="${vol.statusVol?.status == 'Planifie'} ? 'badge-info' : 
                                                          (${vol.statusVol?.status == 'En vol'} ? 'badge-warning' : 
                                                          (${vol.statusVol?.status == 'Arrive'} ? 'badge-success' : 'badge-danger'))"
                                          th:text="${vol.statusVol?.status}"></span>
                                <td class="table-actions">
                                    <button class="btn btn-icon btn-info" th:data-id="${vol.id}" data-action="view" title="Voir">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                    <button class="btn btn-icon btn-warning" th:data-id="${vol.id}" data-action="edit" title="Modifier">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button class="btn btn-icon btn-danger" th:data-id="${vol.id}" data-action="delete" title="Supprimer">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${vols == null or #lists.isEmpty(vols)}"><td colspan="8" class="text-muted">Aucune donnée disponible.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer">
                <div class="pagination">
                    <span class="pagination-info">Affichage de 1 à 10 sur 45 entrées</span>
                    <div class="pagination-links">
                        <a href="#"><i class="fas fa-chevron-left"></i></a>
                        <span class="active">1</span>
                        <a href="#">2</a>
                        <a href="#">3</a>
                        <a href="#">4</a>
                        <a href="#">5</a>
                        <a href="#"><i class="fas fa-chevron-right"></i></a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal Form -->
        <div class="modal-overlay" id="formModal">
            <div class="modal modal-lg">
                <div class="modal-header">
                    <h3><i class="fas fa-plane-departure"></i> <span id="modalTitle">Nouveau Vol</span></h3>
                    <button class="modal-close" data-modal-close>&times;</button>
                </div>
                <form id="entityForm" method="post" th:action="@{/vols/save}">
                    <div class="modal-body">
                        <input type="hidden" name="id" id="entityId">
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="numeroVol">Numéro de Vol <span class="required">*</span></label>
                                <input type="text" class="form-control" id="numeroVol" name="numeroVol" required placeholder="Ex: MAD-001">
                            </div>
                            <div class="form-group">
                                <label for="avion">Avion <span class="required">*</span></label>
                                <select class="form-control" id="avion" name="avion.id" required>
                                    <option value="">-- Sélectionner --</option>
                                    <option th:each="avion : ${avions}" th:value="${avio n.id}" th:text="${avion.codeAvion}">AVN-001</option>

                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="aeroportDepart">Aéroport de Départ <span class="required">*</span></label>
                                <select class="form-control" id="aeroportDepart" name="aeroportDepart.id" required>
                                    <option value="">-- Sélectionner --</option>
                                    <option th:each="aeroport : ${aeroports}" th:value="${aeroport.id}" th:text="${aeroport.codeIata + ' - ' + aeroport.nom}"></option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="aeroportArrivee">Aéroport d'Arrivée <span class="required">*</span></label>
                                <select class="form-control" id="aeroportArrivee" name="aeroportArrivee.id" required>
                                    <option value="">-- Sélectionner --</option>
                                    <option th:each="aeroport : ${aeroports}" th:value="${aeroport.id}" th:text="${aeroport.codeIata + ' - ' + aeroport.nom}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="dateHeureDepart">Date/Heure de Départ <span class="required">*</span></label>
                                <input type="datetime-local" class="form-control" id="dateHeureDepart" name="dateHeureDepart" required>
                            </div>
                            <div class="form-group">
                                <label for="dateHeureArrivee">Date/Heure d'Arrivée <span class="required">*</span></label>
                                <input type="datetime-local" class="form-control" id="dateHeureArrivee" name="dateHeureArrivee" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="statusVol">Status <span class="required">*</span></label>
                                <select class="form-control" id="statusVol" name="statusVol.id" required>
                                    <option value="">-- Sélectionner --</option>
                                    <option th:each="status : ${statusList}" th:value="${status.status}" th:text="${status.status}"></option>

                                </select>
                            </div>
                            <div class="form-group">
                                <label for="distance">Distance (km)</label>
                                <input type="number" class="form-control" id="distance" name="distance" min="0" placeholder="8500">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-modal-close>
                            <i class="fas fa-times"></i> Annuler
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Enregistrer
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </th:block>

    <!-- Page specific JS -->
    <th:block th:fragment="extraJs">
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                AviationApp.handleFormSubmit('entityForm');
            });
        </script>
    </th:block>
</body>
</html>
