<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{layout/main :: html(
          pageTitle='Tableau de Bord',
          breadcrumb='Dashboard',
          currentPage='dashboard',
          content=~{::content}
      )}">
<body>
    <th:block th:fragment="content">
        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon primary">
                    <i class="fas fa-plane-departure"></i>
                </div>
                <div class="stat-info">
                    <h3 th:text="${totalVols}"></h3>
                    <p>Vols aujourd'hui</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon success">
                    <i class="fas fa-users"></i>
                </div>
                <div class="stat-info">
                    <h3 th:text="${totalPassagers}"></h3>
                    <p>Passagers</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon warning">
                    <i class="fas fa-plane"></i>
                </div>
                <div class="stat-info">
                    <h3 th:text="${totalAvions}"></h3>
                    <p>Avions en service</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon info">
                    <i class="fas fa-ticket"></i>
                </div>
                <div class="stat-info">
                    <h3 th:text="${totalReservations}"></h3>
                    <p>Réservations</p>
                </div>
            </div>
        </div>

        <div class="row" style="display: grid; grid-template-columns: 2fr 1fr; gap: 25px;">
            <!-- Recent Flights -->
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">
                        <i class="fas fa-clock"></i>
                        Vols Récents
                    </h3>
                    <a href="/vols" class="btn btn-sm btn-outline">Voir tout</a>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>N° Vol</th>
                                    <th>Origine</th>
                                    <th>Destination</th>
                                    <th>Départ</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="vol : ${recentVols}" th:if="${recentVols != null}">
                                    <td th:text="${vol.numeroVol}"></td>
                                    <td th:text="${vol.aeroportOrigine?.nomAeroport}"></td>
                                    <td th:text="${vol.aeroportDestination?.nomAeroport}"></td>
                                    <td th:text="${#temporals.format(vol.dateDepart, 'dd/MM HH:mm')}"></td>
                                    <td><span class="badge badge-success" th:text="${vol.statusVol?.status}"></span></td>
                                </tr>
                                <tr th:if="${recentVols == null or #lists.isEmpty(recentVols)}"><td colspan="5" class="text-muted">Aucune donnée récente.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">
                        <i class="fas fa-bolt"></i>
                        Actions Rapides
                    </h3>
                </div>
                <div class="card-body">
                    <div style="display: flex; flex-direction: column; gap: 12px;">
                        <a href="/vols/new" class="btn btn-primary btn-lg" style="justify-content: flex-start;">
                            <i class="fas fa-plus-circle"></i>
                            Nouveau Vol
                        </a>
                        <a href="/reservations/new" class="btn btn-success btn-lg" style="justify-content: flex-start;">
                            <i class="fas fa-calendar-plus"></i>
                            Nouvelle Réservation
                        </a>
                        <a href="/passagers/new" class="btn btn-info btn-lg" style="justify-content: flex-start;">
                            <i class="fas fa-user-plus"></i>
                            Nouveau Passager
                        </a>
                        <a href="/avions" class="btn btn-warning btn-lg" style="justify-content: flex-start;">
                            <i class="fas fa-plane-circle-check"></i>
                            Gérer Avions
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </th:block>
</body>
</html>
