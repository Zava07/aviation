<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{layout/main :: html(
          pageTitle='Gestion des Paiements',
          pageDescription='Suivi des transactions et paiements',
          breadcrumb='Paiements',
          breadcrumbParent='Finances',
          breadcrumbParentUrl='/billets',
          currentPage='paiements',
          content=~{::content}
      )}">
<body>
    <th:block th:fragment="content">
        <!-- Filter Card -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">
                    <i class="fas fa-filter"></i>
                    Filtres de recherche
                </h3>
                <button type="button" class="btn btn-sm btn-secondary" id="resetFilters">
                    <i class="fas fa-redo"></i> Réinitialiser
                </button>
            </div>
            <div class="card-body">
                <form id="filterForm" class="filter-bar">
                    <div class="filter-group">
                        <label for="filterBillet">N° Billet</label>
                        <input type="text" id="filterBillet" name="billet" placeholder="Ex: BLT-001">
                    </div>
                    <div class="filter-group">
                        <label for="filterMethode">Méthode</label>
                        <select id="filterMethode" name="methode">
                            <option value="">Toutes</option>
                            <option th:each="methode : ${methodes}" th:value="${methode.methode}" th:text="${methode.methode}"></option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filterStatus">Statut</label>
                        <select id="filterStatus" name="status">
                            <option value="">Tous</option>
                            <option th:each="status : ${statusList}" th:value="${status.status}" th:text="${status.status}"></option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filterDateDebut">Date du</label>
                        <input type="date" id="filterDateDebut" name="dateDebut">
                    </div>
                    <div class="filter-group">
                        <label for="filterDateFin">au</label>
                        <input type="date" id="filterDateFin" name="dateFin">
                    </div>
                </form>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="stats-grid" style="grid-template-columns: repeat(4, 1fr); margin-bottom: 1.5rem;">
            <div class="stats-card">
                <div class="stats-icon" style="background: linear-gradient(135deg, #28a745, #20c997);">
                    <i class="fas fa-check-circle"></i>
                </div>
                <div class="stats-info">
                    <span class="stats-value" th:text="${totalValide}"></span>
                    <span class="stats-label">Total Validé (Ar)</span>
                </div>
            </div>
            <div class="stats-card">
                <div class="stats-icon" style="background: linear-gradient(135deg, #ffc107, #fd7e14);">
                    <i class="fas fa-clock"></i>
                </div>
                <div class="stats-info">
                    <span class="stats-value" th:text="${totalAttente}"></span>
                    <span class="stats-label">En Attente (Ar)</span>
                </div>
            </div>
            <div class="stats-card">
                <div class="stats-icon" style="background: linear-gradient(135deg, #dc3545, #e83e8c);">
                    <i class="fas fa-undo"></i>
                </div>
                <div class="stats-info">
                    <span class="stats-value" th:text="${totalRembourse}"></span>
                    <span class="stats-label">Remboursé (Ar)</span>
                </div>
            </div>
            <div class="stats-card">
                <div class="stats-icon" style="background: linear-gradient(135deg, #6c757d, #495057);">
                    <i class="fas fa-receipt"></i>
                </div>
                <div class="stats-info">
                    <span class="stats-value" th:text="${nbTransactions}"></span>
                    <span class="stats-label">Transactions</span>
                </div>
            </div>
        </div>

        <!-- Data Card -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">
                    <i class="fas fa-credit-card"></i>
                    Liste des Paiements
                    <span class="badge badge-primary" id="resultCount" th:text="${paiements != null ? #lists.size(paiements) + ' paiement(s)' : ''}"></span>
                </h3>
                <button type="button" class="btn btn-primary" data-modal-open="formModal" onclick="AviationApp.resetForm()">
                    <i class="fas fa-plus"></i> Nouveau Paiement
                </button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>N° Billet</th>
                                <th>Passager</th>
                                <th>Montant</th>
                                <th>Devise</th>
                                <th>Méthode</th>
                                <th>Date</th>
                                <th>Statut</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Real data -->
                            <tr th:each="paiement : ${paiements}" th:if="${paiements != null}" th:data-id="${paiement.id}">
                                <td data-filter="billet" th:text="${paiement.billet?.numeroBillet}"></td>
                                <td th:text="${paiement.billet?.reservation?.passager?.nom + ' ' + paiement.billet?.reservation?.passager?.prenom}"></td>
                                <td th:text="${#numbers.formatDecimal(paiement.montant, 0, 'COMMA', 0, 'POINT')}"></td>
                                <td th:text="${paiement.devise?.codeDevise}"></td>
                                <td data-filter="methode" th:text="${paiement.methodePaiement?.methode}"></td>
                                <td th:text="${#temporals.format(paiement.datePaiement, 'dd/MM/yyyy HH:mm')}"></td>
                                <td data-filter="status">
                                    <span class="badge" 
                                          th:classappend="${paiement.statusPaiement?.status == 'Valide'} ? 'badge-success' : 
                                                          (${paiement.statusPaiement?.status == 'En attente'} ? 'badge-warning' : 
                                                          (${paiement.statusPaiement?.status == 'Rembourse'} ? 'badge-info' : 'badge-danger'))"
                                          th:text="${paiement.statusPaiement?.status}"></span>
                                </td>
                                <td class="table-actions">
                                    <button class="btn btn-icon btn-info" th:data-id="${paiement.id}" data-action="view" title="Voir">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                    <button class="btn btn-icon btn-success" th:data-id="${paiement.id}" data-action="receipt" title="Reçu">
                                        <i class="fas fa-receipt"></i>
                                    </button>
                                    <button class="btn btn-icon btn-danger" th:data-id="${paiement.id}" data-action="delete" title="Supprimer">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${paiements == null or #lists.isEmpty(paiements)}"><td colspan="8" class="text-muted">Aucune donnée disponible.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer">
                <div class="pagination">
                    <span class="pagination-info">Affichage de 1 à 10 sur 48 entrées</span>
                    <div class="pagination-links">
                        <a href="#"><i class="fas fa-chevron-left"></i></a>
                        <span class="active">1</span>
                        <a href="#">2</a>
                        <a href="#">3</a>
                        <a href="#">4</a>
                        <a href="#">5</a>
                        <a href="#"><i class="fas fa-chevron-right"></i></a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal Form -->
        <div class="modal-overlay" id="formModal">
            <div class="modal">
                <div class="modal-header">
                    <h3><i class="fas fa-credit-card"></i> <span id="modalTitle">Nouveau Paiement</span></h3>
                    <button class="modal-close" data-modal-close>&times;</button>
                </div>
                <form id="entityForm" method="post" th:action="@{/paiements/save}">
                    <div class="modal-body">
                        <input type="hidden" name="id" id="entityId">
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="billet">Billet <span class="required">*</span></label>
                                <select class="form-control" id="billet" name="billet.id" required>
                                    <option value="">-- Sélectionner --</option>
                                    <option th:each="billet : ${billets}" th:value="${billet.id}" th:text="${billet.numeroBillet}"></option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="montant">Montant <span class="required">*</span></label>
                                <input type="number" step="0.01" class="form-control" id="montant" name="montant" required min="0" placeholder="450000">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="devise">Devise <span class="required">*</span></label>
                                <select class="form-control" id="devise" name="devise.id" required>
                                    <option value="">-- Sélectionner --</option>
                                    <option th:each="devise : ${devises}" th:value="${devise.id}" th:text="${devise.codeDevise + ' - ' + devise.nomDevise}"></option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="methodePaiement">Méthode <span class="required">*</span></label>
                                <select class="form-control" id="methodePaiement" name="methodePaiement.id" required>
                                    <option value="">-- Sélectionner --</option>
                                    <option th:each="methode : ${methodes}" th:value="${methode.id}" th:text="${methode.methode}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="datePaiement">Date Paiement <span class="required">*</span></label>
                                <input type="datetime-local" class="form-control" id="datePaiement" name="datePaiement" required>
                            </div>
                            <div class="form-group">
                                <label for="statusPaiement">Statut <span class="required">*</span></label>
                                <select class="form-control" id="statusPaiement" name="statusPaiement.id" required>
                                    <option value="">-- Sélectionner --</option>
                                    <option th:each="status : ${statusList}" th:value="${status.id}" th:text="${status.status}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="reference">Référence Transaction</label>
                            <input type="text" class="form-control" id="reference" name="reference" placeholder="REF-XXXX-XXXX">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-modal-close>
                            <i class="fas fa-times"></i> Annuler
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Enregistrer
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </th:block>

    <!-- Page specific JS -->
    <th:block th:fragment="extraJs">
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                AviationApp.handleFormSubmit('entityForm');
            });
        </script>
    </th:block>
</body>
</html>
