<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout/main :: head(
        pageTitle='Gestion des Réservations', 
        pageDescription='Suivi et gestion des réservations clients')">
</head>
<body th:replace="layout/main :: body(content=~{::content})">

<!-- Contenu principal -->
<th:block th:fragment="content">

    <!-- Filter Card -->
    <div class="card">
        <div class="card-header">
            <h3 class="card-title">
                <i class="fas fa-filter"></i>
                Filtres de recherche
            </h3>
            <div class="card-actions">
                <button type="button" class="btn btn-sm btn-secondary" id="resetFilters" 
                        onclick="window.location.href='@{/reservations}'">
                    <i class="fas fa-redo"></i> Réinitialiser
                </button>
                <button type="submit" form="filterForm" class="btn btn-sm btn-primary" id="searchBtn">
                    <i class="fas fa-search"></i> Rechercher
                </button>
            </div>
        </div>
        <div class="card-body">
            <form id="filterForm" class="filter-bar" method="get" th:action="@{/reservations}">
                <div class="filter-group">
                    <label for="filterNumero">N° Réservation</label>
                    <input type="text" id="filterNumero" name="numero" placeholder="Ex: RES-001" 
                           th:value="${filterNumero}">
                </div>
                <div class="filter-group">
                    <label for="filterPassager">Passager</label>
                    <input type="text" id="filterPassager" name="passager" placeholder="Nom du passager" 
                           th:value="${filterPassager}">
                </div>
                <div class="filter-group">
                    <label for="filterVol">N° Vol</label>
                    <input type="text" id="filterVol" name="vol" placeholder="Ex: MAD-001" 
                           th:value="${filterVol}">
                </div>
                <div class="filter-group">
                    <label for="filterStatus">Statut</label>
                    <select id="filterStatus" name="status">
                        <option value="">Tous</option>
                        <option th:each="status : ${statusList}" 
                                th:value="${status.id}" 
                                th:text="${status.nomStatus}" 
                                th:selected="${status.id == filterStatus}">
                        </option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filterDate">Date Réservation</label>
                    <input type="date" id="filterDate" name="dateReservation" th:value="${filterDate}">
                </div>
            </form>
        </div>
    </div>

    <!-- Data Card -->
    <div class="card">
        <div class="card-header">
            <h3 class="card-title">
                <i class="fas fa-calendar-check"></i>
                Liste des Réservations
                <span class="badge badge-primary" id="resultCount" 
                      th:text="${reservations != null ? #lists.size(reservations) + ' réservation(s)' : ''}">
                </span>
            </h3>
            <button type="button" class="btn btn-primary" data-modal-open="formModal" onclick="AviationApp.resetForm()">
                <i class="fas fa-plus"></i> Nouvelle Réservation
            </button>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>N° Réservation</th>
                            <th>Passager</th>
                            <th>Vol</th>
                            <th>Classe</th>
                            <th>Date Réservation</th>
                            <th>Statut</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="reservation : ${reservations}" th:if="${reservations != null}" th:data-id="${reservation.id}">
                            <td th:text="${reservation.numReservation}"></td>
                            <td th:text="${reservation.passager?.nom + ' ' + reservation.passager?.prenom}"></td>
                            <td th:text="${reservation.vol?.numeroVol}"></td>
                            <td th:text="${reservation.classe?.nomClasse}"></td>
                            <td th:text="${#temporals.format(reservation.dateReservation, 'dd/MM/yyyy HH:mm')}"></td>
                            <td>
                                <span class="badge" 
                                      th:classappend="${reservation.statutReservation?.nomStatus == 'Confirmé'} ? 'badge-success' : 
                                                      (${reservation.statutReservation?.nomStatus == 'En attente'} ? 'badge-warning' : 'badge-danger')"
                                      th:text="${reservation.statutReservation?.nomStatus}">
                                </span>
                            </td>
                            <td class="table-actions">
                                <button class="btn btn-icon btn-info" th:data-id="${reservation.id}" data-action="view" title="Voir">
                                    <i class="fas fa-eye"></i>
                                </button>
                                <button class="btn btn-icon btn-warning" th:data-id="${reservation.id}" data-action="edit" title="Modifier">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-icon btn-success" th:data-id="${reservation.id}" data-action="billet" title="Émettre Billet">
                                    <i class="fas fa-ticket-alt"></i>
                                </button>
                                <button class="btn btn-icon btn-danger" th:data-id="${reservation.id}" data-action="delete" title="Supprimer">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                        <tr th:if="${reservations == null or #lists.isEmpty(reservations)}">
                            <td colspan="7" class="text-muted">Aucune donnée disponible.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Form -->
    <div class="modal-overlay" id="formModal">
        <div class="modal modal-lg">
            <div class="modal-header">
                <h3><i class="fas fa-calendar-check"></i> <span id="modalTitle">Nouvelle Réservation</span></h3>
                <button class="modal-close" data-modal-close>&times;</button>
            </div>
            <form id="entityForm" method="post" th:action="@{/reservations/save}">
                <div class="modal-body">
                    <input type="hidden" name="id" id="entityId">

                    <div class="form-row">
                        <div class="form-group">
                            <label for="numReservation">N° Réservation <span class="required">*</span></label>
                            <input type="text" class="form-control" id="numReservation" name="numReservation" required placeholder="Ex: RES-001">
                        </div>
                        <div class="form-group">
                            <label for="passager">Passager <span class="required">*</span></label>
                            <select class="form-control" id="passager" name="passager.id" required>
                                <option value="">-- Sélectionner --</option>
                                <option th:each="passager : ${passagers}" 
                                        th:value="${passager.id}" 
                                        th:text="${passager.nom + ' ' + passager.prenom}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="vol">Vol <span class="required">*</span></label>
                            <select class="form-control" id="vol" name="vol.id" required>
                                <option value="">-- Sélectionner --</option>
                                <option th:each="vol : ${vols}" 
                                        th:value="${vol.id}" 
                                        th:text="${vol.numeroVol + ' (' + vol.aeroportDepart?.codeIata + ' → ' + vol.aeroportArrivee?.codeIata + ')'}">
                                </option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="classe">Classe <span class="required">*</span></label>
                            <select class="form-control" id="classe" name="classe.id" required>
                                <option value="">-- Sélectionner --</option>
                                <option th:each="classe : ${classes}" 
                                        th:value="${classe.id}" 
                                        th:text="${classe.nomClasse}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="siegeVol">Siège</label>
                            <select class="form-control" id="siege" name="siege.id">
                                <option value="">-- Sélectionner --</option>
                                <option th:each="siege : ${sieges}" 
                                        th:value="${siege.siege?.id}" 
                                        th:text="${siege.siege?.numero}">
                                </option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="statutReservation">Statut <span class="required">*</span></label>
                            <select class="form-control" id="statutReservation" name="statutReservation.id" required>
                                <option value="">-- Sélectionner --</option>
                                <option th:each="status : ${statusList}" 
                                        th:value="${status.id}" 
                                        th:text="${status.nomStatus}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="dateReservation">Date Réservation <span class="required">*</span></label>
                            <input type="datetime-local" class="form-control" id="dateReservation" name="dateReservation" required>
                        </div>
                        <div class="form-group">
                            <label for="notes">Notes</label>
                            <textarea class="form-control" id="notes" name="notes" rows="2" placeholder="Notes supplémentaires..."></textarea>
                        </div>
                    </div>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-modal-close>
                        <i class="fas fa-times"></i> Annuler
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Enregistrer
                    </button>
                </div>
            </form>
        </div>
    </div>

</th:block>

<!-- Page specific JS -->
<th:block th:fragment="extraJs">
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            AviationApp.handleFormSubmit('entityForm');
        });
    </script>
</th:block>

</body>
</html>
