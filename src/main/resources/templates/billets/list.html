<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{layout/main :: html(
          pageTitle='Gestion des Billets',
          pageDescription='Émission et suivi des billets',
          breadcrumb='Billets',
          breadcrumbParent='Finances',
          breadcrumbParentUrl='/paiements',
          currentPage='billets',
          content=~{::content}
      )}">
<body>
    <th:block th:fragment="content">
        <!-- Filter Card -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">
                    <i class="fas fa-filter"></i>
                    Filtres de recherche
                </h3>
                <button type="button" class="btn btn-sm btn-secondary" id="resetFilters">
                    <i class="fas fa-redo"></i> Réinitialiser
                </button>
            </div>
            <div class="card-body">
                <form id="filterForm" class="filter-bar">
                    <div class="filter-group">
                        <label for="filterNumero">N° Billet</label>
                        <input type="text" id="filterNumero" name="numero" placeholder="Ex: BLT-001">
                    </div>
                    <div class="filter-group">
                        <label for="filterReservation">N° Réservation</label>
                        <input type="text" id="filterReservation" name="reservation" placeholder="Ex: RES-001">
                    </div>
                    <div class="filter-group">
                        <label for="filterStatus">Statut</label>
                        <select id="filterStatus" name="status">
                            <option value="">Tous</option>
                            <option th:each="status : ${statusList}" th:value="${status.status}" th:text="${status.status}"></option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filterDateEmission">Date Émission</label>
                        <input type="date" id="filterDateEmission" name="dateEmission">
                    </div>
                </form>
            </div>
        </div>

        <!-- Data Card -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">
                    <i class="fas fa-ticket-alt"></i>
                    Liste des Billets
                    <span class="badge badge-primary" id="resultCount" th:text="${billets != null ? #lists.size(billets) + ' billet(s)' : ''}"></span>
                </h3>
                <button type="button" class="btn btn-primary" data-modal-open="formModal" onclick="AviationApp.resetForm()">
                    <i class="fas fa-plus"></i> Émettre un Billet
                </button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>N° Billet</th>
                                <th>Réservation</th>
                                <th>Passager</th>
                                <th>Vol</th>
                                <th>Siège</th>
                                <th>Prix</th>
                                <th>Date Émission</th>
                                <th>Statut</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Real data -->
                            <tr th:each="billet : ${billets}" th:if="${billets != null}" th:data-id="${billet.id}">
                                <td data-filter="numero" th:text="${billet.numeroBillet}"></td>
                                <td data-filter="reservation" th:text="${billet.reservation?.numReservation}"></td>
                                <td th:text="${billet.reservation?.passager?.nom + ' ' + billet.reservation?.passager?.prenom}"></td>
                                <td th:text="${billet.reservation?.vol?.numeroVol}"></td>
                                <td th:text="${billet.reservation?.siege?.numero ?: '-'}"></td>
                                <td th:text="${billet.prixFinal != null ? #numbers.formatDecimal(billet.prixFinal, 0, 'COMMA', 0, 'POINT') + ' Ar' : '-'}"></td>
                                <td th:text="${#temporals.format(billet.dateEmission, 'dd/MM/yyyy')}"></td>
                                <td data-filter="status">
                                    <span class="badge" 
                                          th:classappend="${billet.statusBillet?.status == 'Embarque'} ? 'badge-success' : 
                                                          (${billet.statusBillet?.status == 'Emis'} ? 'badge-info' :
                                                          (${billet.statusBillet?.status == 'Enregistre'} ? 'badge-warning' : 'badge-danger'))"
                                          th:text="${billet.statusBillet?.status}"></span>
                                </td>
                                <td class="table-actions">
                                    <button class="btn btn-icon btn-info" th:data-id="${billet.id}" data-action="view" title="Voir">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                    <button class="btn btn-icon btn-primary" th:data-id="${billet.id}" data-action="print" title="Imprimer">
                                        <i class="fas fa-print"></i>
                                    </button>
                                    <button class="btn btn-icon btn-warning" th:data-id="${billet.id}" data-action="edit" title="Modifier">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button class="btn btn-icon btn-danger" th:data-id="${billet.id}" data-action="delete" title="Annuler">
                                        <i class="fas fa-ban"></i>
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${billets == null or #lists.isEmpty(billets)}"><td colspan="9" class="text-muted">Aucune donnée disponible.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer">
                <div class="pagination">
                    <span class="pagination-info">Affichage de 1 à 10 sur 85 entrées</span>
                    <div class="pagination-links">
                        <a href="#"><i class="fas fa-chevron-left"></i></a>
                        <span class="active">1</span>
                        <a href="#">2</a>
                        <a href="#">3</a>
                        <span>...</span>
                        <a href="#">9</a>
                        <a href="#"><i class="fas fa-chevron-right"></i></a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal Form -->
        <div class="modal-overlay" id="formModal">
            <div class="modal">
                <div class="modal-header">
                    <h3><i class="fas fa-ticket-alt"></i> <span id="modalTitle">Émettre un Billet</span></h3>
                    <button class="modal-close" data-modal-close>&times;</button>
                </div>
                <form id="entityForm" method="post" th:action="@{/billets/save}">
                    <div class="modal-body">
                        <input type="hidden" name="id" id="entityId">
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="numeroBillet">N° Billet <span class="required">*</span></label>
                                <input type="text" class="form-control" id="numeroBillet" name="numeroBillet" required placeholder="Ex: BLT-001">
                            </div>
                            <div class="form-group">
                                <label for="reservation">Réservation <span class="required">*</span></label>
                                <select class="form-control" id="reservation" name="reservation.id" required>
                                    <option value="">-- Sélectionner --</option>
                                    <option th:each="reservation : ${reservations}" th:value="${reservation.id}" th:text="${reservation.numReservation + ' - ' + reservation.passager?.nom}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="prixFinal">Prix Final <span class="required">*</span></label>
                                <input type="number" step="0.01" class="form-control" id="prixFinal" name="prixFinal" required min="0" placeholder="450000">
                            </div>
                            <div class="form-group">
                                <label for="dateEmission">Date Émission <span class="required">*</span></label>
                                <input type="datetime-local" class="form-control" id="dateEmission" name="dateEmission" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="statusBillet">Statut <span class="required">*</span></label>
                                <select class="form-control" id="statusBillet" name="statusBillet.id" required>
                                    <option value="">-- Sélectionner --</option>
                                    <option th:each="status : ${statusList}" th:value="${status.id}" th:text="${status.status}"></option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="codeQR">Code QR</label>
                                <input type="text" class="form-control" id="codeQR" name="codeQR" placeholder="Généré automatiquement">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-modal-close>
                            <i class="fas fa-times"></i> Annuler
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Enregistrer
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </th:block>

    <!-- Page specific JS -->
    <th:block th:fragment="extraJs">
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                AviationApp.handleFormSubmit('entityForm');
            });
        </script>
    </th:block>
</body>
</html>
