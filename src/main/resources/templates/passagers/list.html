<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{layout/main :: html(
          pageTitle='Gestion des Passagers',
          pageDescription='Base de données clients et passagers',
          breadcrumb='Passagers',
          breadcrumbParent='Réservations',
          breadcrumbParentUrl='/reservations',
          currentPage='passagers',
          content=~{::content}
      )}">
<body>
    <th:block th:fragment="content">
        <!-- Filter Card -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">
                    <i class="fas fa-filter"></i>
                    Filtres de recherche
                </h3>
                <button type="button" class="btn btn-sm btn-secondary" id="resetFilters">
                    <i class="fas fa-redo"></i> Réinitialiser
                </button>
            </div>
            <div class="card-body">
                <form id="filterForm" class="filter-bar">
                    <div class="filter-group">
                        <label for="filterNom">Nom</label>
                        <input type="text" id="filterNom" name="nom" placeholder="Nom de famille">
                    </div>
                    <div class="filter-group">
                        <label for="filterPrenom">Prénom</label>
                        <input type="text" id="filterPrenom" name="prenom" placeholder="Prénom">
                    </div>
                    <div class="filter-group">
                        <label for="filterPasseport">N° Passeport</label>
                        <input type="text" id="filterPasseport" name="passeport" placeholder="Ex: 123456789">
                    </div>
                    <div class="filter-group">
                        <label for="filterType">Type Passager</label>
                        <select id="filterType" name="type">
                            <option value="">Tous</option>
                            <option th:each="type : ${types}" th:value="${type.typePassager}" th:text="${type.typePassager}"></option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filterNationalite">Nationalité</label>
                        <input type="text" id="filterNationalite" name="nationalite" placeholder="Ex: Malagasy">
                    </div>
                </form>
            </div>
        </div>

        <!-- Data Card -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">
                    <i class="fas fa-users"></i>
                    Liste des Passagers
                    <span class="badge badge-primary" id="resultCount" th:text="${passagers != null ? #lists.size(passagers) + ' passager(s)' : ''}"></span>
                </h3>
                <button type="button" class="btn btn-primary" data-modal-open="formModal" onclick="AviationApp.resetForm()">
                    <i class="fas fa-plus"></i> Nouveau Passager
                </button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Nom</th>
                                <th>Prénom</th>
                                <th>N° Passeport</th>
                                <th>Date de Naissance</th>
                                <th>Nationalité</th>
                                <th>Type</th>
                                <th>Contact</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Real data -->
                            <tr th:each="passager : ${passagers}" th:if="${passagers != null}" th:data-id="${passager.id}">
                                <td data-filter="nom" th:text="${passager.nom}"></td>
                                <td data-filter="prenom" th:text="${passager.prenom}"></td>
                                <td data-filter="passeport" th:text="${passager.numPasseport}"></td>
                                <td th:text="${#temporals.format(passager.dateNaissance, 'dd/MM/yyyy')}"></td>
                                <td data-filter="nationalite" th:text="${passager.nationalite}"></td>
                                <td data-filter="type">
                                    <span class="badge badge-info" th:text="${passager.typePassager?.typePassager}"></span>
                                </td>
                                <td th:text="${passager.telephone}"></td>
                                <td class="table-actions">
                                    <button class="btn btn-icon btn-info" th:data-id="${passager.id}" data-action="view" title="Voir">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                    <button class="btn btn-icon btn-warning" th:data-id="${passager.id}" data-action="edit" title="Modifier">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button class="btn btn-icon btn-danger" th:data-id="${passager.id}" data-action="delete" title="Supprimer">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${passagers == null or #lists.isEmpty(passagers)}"><td colspan="8" class="text-muted">Aucune donnée disponible.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer">
                <div class="pagination">
                    <span class="pagination-info">Affichage de 1 à 10 sur 125 entrées</span>
                    <div class="pagination-links">
                        <a href="#"><i class="fas fa-chevron-left"></i></a>
                        <span class="active">1</span>
                        <a href="#">2</a>
                        <a href="#">3</a>
                        <span>...</span>
                        <a href="#">13</a>
                        <a href="#"><i class="fas fa-chevron-right"></i></a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal Form -->
        <div class="modal-overlay" id="formModal">
            <div class="modal modal-lg">
                <div class="modal-header">
                    <h3><i class="fas fa-user"></i> <span id="modalTitle">Nouveau Passager</span></h3>
                    <button class="modal-close" data-modal-close>&times;</button>
                </div>
                <form id="entityForm" method="post" th:action="@{/passagers/save}">
                    <div class="modal-body">
                        <input type="hidden" name="id" id="entityId">
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="nom">Nom <span class="required">*</span></label>
                                <input type="text" class="form-control" id="nom" name="nom" required placeholder="Ex: RAKOTO">
                            </div>
                            <div class="form-group">
                                <label for="prenom">Prénom <span class="required">*</span></label>
                                <input type="text" class="form-control" id="prenom" name="prenom" required placeholder="Ex: Jean">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="numPasseport">N° Passeport <span class="required">*</span></label>
                                <input type="text" class="form-control" id="numPasseport" name="numPasseport" required placeholder="Ex: P12345678">
                            </div>
                            <div class="form-group">
                                <label for="dateNaissance">Date de Naissance <span class="required">*</span></label>
                                <input type="date" class="form-control" id="dateNaissance" name="dateNaissance" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="nationalite">Nationalité <span class="required">*</span></label>
                                <input type="text" class="form-control" id="nationalite" name="nationalite" required placeholder="Ex: Malagasy">
                            </div>
                            <div class="form-group">
                                <label for="typePassager">Type <span class="required">*</span></label>
                                <select class="form-control" id="typePassager" name="typePassager.id" required>
                                    <option value="">-- Sélectionner --</option>
                                    <option th:each="type : ${types}" th:value="${type.id}" th:text="${type.typePassager}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="sexe">Sexe <span class="required">*</span></label>
                                <select class="form-control" id="sexe" name="sexe" required>
                                    <option value="">-- Sélectionner --</option>
                                    <option value="M">Masculin</option>
                                    <option value="F">Féminin</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="email">Email</label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="email@exemple.com">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="telephone">Téléphone</label>
                                <input type="tel" class="form-control" id="telephone" name="telephone" placeholder="+261 34 00 000 00">
                            </div>
                            <div class="form-group">
                                <label for="adresse">Adresse</label>
                                <input type="text" class="form-control" id="adresse" name="adresse" placeholder="Adresse complète">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-modal-close>
                            <i class="fas fa-times"></i> Annuler
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Enregistrer
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </th:block>

    <!-- Page specific JS -->
    <th:block th:fragment="extraJs">
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                AviationApp.handleFormSubmit('entityForm');
            });
        </script>
    </th:block>
</body>
</html>
