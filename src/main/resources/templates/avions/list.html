<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{layout/main :: html(
          pageTitle='Gestion des Avions',
          pageDescription='Liste et gestion de la flotte aérienne',
          breadcrumb='Avions',
          breadcrumbParent='Vols & Avions',
          breadcrumbParentUrl='/vols',
          currentPage='avions',
          content=~{::content}
      )}">
<body>
    <th:block th:fragment="content">
        <!-- Filter Card -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">
                    <i class="fas fa-filter"></i>
                    Filtres de recherche
                </h3>
                <button type="button" class="btn btn-sm btn-secondary" id="resetFilters">
                    <i class="fas fa-redo"></i> Réinitialiser
                </button>
            </div>
            <div class="card-body">
                <form id="filterForm" class="filter-bar">
                    <div class="filter-group">
                        <label for="filterCode">Code Avion</label>
                        <input type="text" id="filterCode" name="code" placeholder="Ex: AVN-001">
                    </div>
                    <div class="filter-group">
                        <label for="filterModele">Modèle</label>
                        <select id="filterModele" name="modele">
                            <option value="">Tous les modèles</option>
                                <option th:each="modele : ${modeles}" th:value="${modele.id}" th:text="${modele.nomModele}"
                                        th:selected="${editAvion != null and editAvion.modeleAvion != null and editAvion.modeleAvion.id == modele.id}"></option>

                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filterEtat">État</label>
                        <select id="filterEtat" name="etat">
                            <option value="">Tous les états</option>
                            <option th:each="etat : ${etats}" th:value="${etat.etat}" th:text="${etat.etat}">En service</option>

                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filterCapacite">Capacité min.</label>
                        <input type="number" id="filterCapacite" name="capacite" placeholder="100">
                    </div>
                </form>
            </div>
        </div>

        <!-- Data Card -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">
                    <i class="fas fa-plane"></i>
                    Liste des Avions
                    <span class="badge badge-primary" id="resultCount" th:text="${avions != null ? #lists.size(avions) + ' avion(s)' : ''}"></span>
                </h3>
                <button type="button" class="btn btn-primary" data-modal-open="formModal" onclick="AviationApp.resetForm()">
                    <i class="fas fa-plus"></i> Nouvel Avion
                </button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Code</th>
                                <th>Modèle</th>
                                <th>Capacité Pass.</th>
                                <th>Capacité Cargo</th>
                                <th>État</th>
                                <th>Points Vol</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Real data -->
                            <tr th:each="avion : ${avions}" th:if="${avions != null}" th:data-id="${avion.id}">
                                <td data-filter="code" th:text="${avion.codeAvion}"></td>
                                <td data-filter="modele" th:text="${avion.modeleAvion?.nomModele}"></td>
                                <td th:text="${avion.capacitePassagers}"></td>
                                <td th:text="${avion.capaciteCargo + ' T'}"></td>
                                <td data-filter="etat">
                                    <span class="badge" 
                                          th:classappend="${avion.etatAvion?.etat == 'En service'} ? 'badge-success' : (${avion.etatAvion?.etat == 'Maintenance'} ? 'badge-warning' : 'badge-danger')"
                                          th:text="${avion.etatAvion?.etat}"></span>
                                </td>
                                <td th:text="${avion.pointVol ?: '0'}"></td>
                                <td class="table-actions">
                                    <button class="btn btn-icon btn-info" th:data-id="${avion.id}" data-action="view" title="Voir">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                    <button class="btn btn-icon btn-warning" th:data-id="${avion.id}" data-action="edit" title="Modifier">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button class="btn btn-icon btn-danger" th:data-id="${avion.id}" data-action="delete" title="Supprimer">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${avions == null or #lists.isEmpty(avions)}"><td colspan="7" class="text-muted">Aucune donnée disponible.</td></tr> 
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer">
                <div class="pagination">
                    <span class="pagination-info">Affichage de 1 à 5 sur 24 entrées</span>
                    <div class="pagination-links">
                        <a href="#"><i class="fas fa-chevron-left"></i></a>
                        <span class="active">1</span>
                        <a href="#">2</a>
                        <a href="#">3</a>
                        <a href="#">4</a>
                        <a href="#">5</a>
                        <a href="#"><i class="fas fa-chevron-right"></i></a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal Form -->
        <div class="modal-overlay" id="formModal">
            <div class="modal">
                <div class="modal-header">
                    <h3><i class="fas fa-plane"></i> <span id="modalTitle">Nouvel Avion</span></h3>
                    <button class="modal-close" data-modal-close>&times;</button>
                </div>
                <form id="entityForm" method="post" th:action="@{/avions/save}">
                    <div class="modal-body">
                        <input type="hidden" name="id" id="entityId">
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="codeAvion">Code Avion <span class="required">*</span></label>
                                <input type="text" class="form-control" id="codeAvion" name="codeAvion" required placeholder="Ex: AVN-001">
                            </div>
                            <div class="form-group">
                                <label for="modeleAvion">Modèle <span class="required">*</span></label>
                                <select class="form-control" id="modeleAvion" name="modeleAvion.id" required>
                                    <option value="">-- Sélectionner --</option>
                                    <option th:each="modele : ${modeles}" th:value="${modele.id}" th:text="${modele.nomModele}">Boeing 737</option>

                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="capacitePassagers">Capacité Passagers <span class="required">*</span></label>
                                <input type="number" class="form-control" id="capacitePassagers" name="capacitePassagers" required min="1" placeholder="160">
                            </div>
                            <div class="form-group">
                                <label for="capaciteCargo">Capacité Cargo (T) <span class="required">*</span></label>
                                <input type="number" step="0.1" class="form-control" id="capaciteCargo" name="capaciteCargo" required min="0" placeholder="25.0">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="etatAvion">État <span class="required">*</span></label>
                                <select class="form-control" id="etatAvion" name="etatAvion.id" required>
                                    <option value="">-- Sélectionner --</option>
                                    <option th:each="etat : ${etats}" th:value="${etat.id}" th:text="${etat.etat}">En service</option>

                                </select>
                            </div>
                            <div class="form-group">
                                <label for="pointVol">Points de Vol</label>
                                <input type="number" class="form-control" id="pointVol" name="pointVol" min="0" placeholder="0">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-modal-close>
                            <i class="fas fa-times"></i> Annuler
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Enregistrer
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </th:block>

    <!-- Page specific JS -->
    <th:block th:fragment="extraJs">
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                AviationApp.handleFormSubmit('entityForm');
            });
        </script>
    </th:block>
</body>
</html>
